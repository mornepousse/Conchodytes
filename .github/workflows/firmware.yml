name: Firmware

# Builds boards/conchodytes against the KeSp firmware submodule through the
# firmware's reusable workflow: artifacts on every push, a release here on a
# v* tag (pre-release when the tag has a suffix).
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['boards/**', 'firmware', '.github/workflows/firmware.yml']
  pull_request:
    paths: ['boards/**', 'firmware', '.github/workflows/firmware.yml']
  workflow_dispatch:

jobs:
  firmware:
    uses: mornepousse/KeSp_firmware/.github/workflows/build-board.yml@main
    with:
      board: conchodytes
    permissions:
      contents: write
